spring:
  application:
    name: kcmart-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/kcmart
    username: kcmart
    password: ${KCMART_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  mail:
    host: ${KCMART_MAIL_HOST}
    port: ${KCMART_MAIL_PORT}
    username: ${KCMART_MAIL_USERNAME}
    password: ${KCMART_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  health:
    mail:
      enabled: false
kcmart:
  admin:
    username: ${KCMART_ADMIN_USERNAME}
    password: ${KCMART_ADMIN_PASSWORD}

  internal:
    api-key: ${KCMART_INTERNAL_API_KEY}

  mail:
    from: ${KCMART_MAIL_FROM}

  razorpay:
    key-id: ${KCMART_RAZORPAY_KEY_ID:}
    key-secret: ${KCMART_RAZORPAY_KEY_SECRET:}
    webhook-secret: ${KCMART_RAZORPAY_WEBHOOK_SECRET:}
    base-url: https://api.razorpay.com

# Delhivery integration - disabled until verified
delhivery:
  enabled: false
  shipment-creation-enabled: false
  base-url: https://track.delhivery.com
  api-token: ${DELHIVERY_API_TOKEN:}
  pickup-location: ${DELHIVERY_PICKUP_LOCATION:}